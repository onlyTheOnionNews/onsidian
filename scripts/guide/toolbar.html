<!doctype html>
<!-- Image source for public/guide/toolbar.png: an illustration of a Chromium toolbar and its extensions menu. -->
<meta charset="utf-8"><title>toolbar</title>
<style>
html, body { margin: 0; background: #202124; }
body { width: 640px; height: 250px; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; color: #e8eaed; position: relative; }
.bar { height: 44px; background: #35363a; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.url { flex: 1; height: 28px; line-height: 28px; border-radius: 14px; background: #202124; color: #bdc1c6; padding: 0 14px; }
.btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; }
.mark { outline: 3px solid #a675ff; outline-offset: 1px; }
.menu { position: absolute; right: 12px; top: 54px; width: 300px; background: #292a2d; border-radius: 8px; padding: 10px 0; box-shadow: 0 4px 16px #0008; }
.menu h4 { margin: 0; padding: 4px 16px 10px; font-size: 13px; font-weight: 600; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #3c3d41; }
.item img { width: 20px; height: 20px; }
.item span { flex: 1; }
.num { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: #a675ff; color: #160530; font-weight: 700; display: grid; place-items: center; }
svg { display: block; fill: none; stroke: #e8eaed; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
<div class="bar">

</div>
<div class="num" style="right: 52px; top: 10px">1</div>

	<div class="item">
		<img src="hoppscotch-icon.png" alt="">

		<svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 7 4 4H6l4-4z"/></svg>
	</div>
</div>
